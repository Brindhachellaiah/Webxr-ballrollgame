<!DOCTYPE html>
<html lang="en">

<head>
	<title>Ball rolling on the table - Brindha</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link type="text/css" rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.js" crossorigin="anonymous"></script>
</head>

<body>
	<script type="module">
    // To start an AR scene with webXR, we can use a handy button provided by three.js
    import { ARButton } from 'https://unpkg.com/three@0.126.0/examples/jsm/webxr/ARButton.js';
    
	let camera, scene, renderer;
    let mesh;
    
	init();
	animate();

	function init() {
			const container = document.createElement('div');
			document.body.appendChild(container);
            
            //Creating the Scene
			
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 40);
            camera.position.set(0, 5, 20);
            camera.lookAt(0, 0, 0);
            //camera.position.y = 4;
			renderer = new THREE.WebGLRenderer({ antialias: true});
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
            //renderer.xr.enabled = true; 
			container.appendChild(renderer.domElement);
            
            // Adding grids for a good view
            scene.add(new THREE.GridHelper(30, 30));
     
            // Creating a box for the tabletop
            var tabletopGeometry = new THREE.BoxGeometry(10, 0.5, 10);
            var tabletopMaterial = new THREE.MeshBasicMaterial({ color: 0x808080 });
            var tabletop = new THREE.Mesh(tabletopGeometry, tabletopMaterial);
            tabletop.position.y = 1.25;
            scene.add(tabletop);

            // Creating legs for the table
            var legGeometry = new THREE.BoxGeometry(1, 2.5, 1);
            var legMaterial = new THREE.MeshBasicMaterial({ color: 0x525252 });
            var leg1 = new THREE.Mesh(legGeometry, legMaterial);
            leg1.position.set(-2, -1, 1.5);
            var leg2 = leg1.clone();
            leg2.position.set(2, -1, 1.5);
            var leg3 = leg1.clone();
            leg3.position.set(-2, -1, -1.5);
            var leg4 = leg1.clone();
            leg4.position.set(2, -1, -1.5);
            scene.add(leg1, leg2, leg3, leg4);

            // Creating a sphere for the ball
            var ballRadius = 1.2;
            var ballGeometry = new THREE.SphereGeometry(ballRadius);
            var ballMaterial = new THREE.MeshBasicMaterial({ color: 0x418200});
            var ball = new THREE.Mesh(ballGeometry, ballMaterial);
            ball.position.set(0, 2.5, 0);
            scene.add(ball);

			// Creating the floor geometry
            var floorGeometry = new THREE.PlaneGeometry(40, 40, 10, 10);
            var floorMaterial = new THREE.MeshBasicMaterial({ color: 0x999999, side: THREE.DoubleSide });
            var floor = new THREE.Mesh(floorGeometry, floorMaterial);

            // Rotate and position the floor
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            scene.add(floor);

			// Adding the AR button to the body of the DOM
			document.body.appendChild(ARButton.createButton(renderer));

            //Zooming in and out
			window.addEventListener('resize', onWindowResize, true);
            
            // Listening  for the devicemotion event
            window.addEventListener("devicemotion", updateBall,true);

            function updateBall() {
            	   // Get the acceleration of the device
                var acceleration = event.accelerationIncludingGravity;

                // Update the position of the ball based on the acceleration
                ball.position.x += acceleration.x * 0.008;
                //ball.position.y += acceleration.y * 0.008;
                ball.position.z += acceleration.z * 0.008;

            // Making sure the ball stays within the bounds of the table
            if (ball.position.x < -5 || ball.position.x > 5  ||
                ball.position.z < -5 || ball.position.z > 5){
                // If the ball has gone over the edge of the table, remove it from the scene
                ball.position.y -= 0.08;
                }
                // The speed at which the ball falls
                var fallSpeed = 0;
                var time_step = 0;
                var maxtime_step = 10;
                // The function that updates the ball's position
                // Increment the fall speed
                fallSpeed -= 0.005;

                // Update the ball's position
                //ball.position.y += fallSpeed;

                // If the ball has fallen off the table
                
                if (ball.position.y < -0.8) {
                    // Reverse the fall speed
                    fallSpeed = -fallSpeed * 0.01;
                    ball.position.y = 0;

                    }
                    
                    // Check if the ball should stop bouncing
                if (Math.abs(fallSpeed) < 0.01) {
                fallSpeed = 0;
                //ball.position.set(0, 2.5, 0);//reset
                }
                    
                }
                requestAnimationFrame(updateBall);
    };
    



		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function animate() {
			renderer.setAnimationLoop(render);
		}

		function render() {  
            requestAnimationFrame(animate);    
			renderer.render(scene, camera);
            //const pi2 = Math.PI / 2;
            //tabletop.rotation.x = pi2 - THREE.MathUtils.degToRad(t) % Math.PI;
		}
        updateBall();
        render();
	</script>
</body>

</html>

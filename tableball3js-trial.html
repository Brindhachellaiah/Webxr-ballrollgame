<!DOCTYPE html>
<html lang="en">

<head>
	<title>Basic Scene with WebXR</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link type="text/css" rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r126/three.js" crossorigin="anonymous"></script>
</head>

<body>
	<script type="module">
    // To start an AR scene with webXR, we can use a handy button provided by three.js
    // We first have to import it because it is a javascript module
    import { ARButton } from 'https://unpkg.com/three@0.126.0/examples/jsm/webxr/ARButton.js';
    
	let camera, scene, renderer;
    let mesh;

		init();
		animate();

		function init() {
			const container = document.createElement('div');
			document.body.appendChild(container);

			scene = new THREE.Scene();

			camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 40);
            camera.position.z = 20;
            //camera.position.y = 4;
			renderer = new THREE.WebGLRenderer({ antialias: true});
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
      // This next line is important to to enable the renderer for WebXR
			//renderer.xr.enabled = true; // New!
			container.appendChild(renderer.domElement);
            
            // Create a box for the tabletop
            var tabletopGeometry = new THREE.BoxGeometry(4.5, 0.5, 4.5);
            var tabletopMaterial = new THREE.MeshBasicMaterial({ color: 0x808080 });
            var tabletop = new THREE.Mesh(tabletopGeometry, tabletopMaterial);
            //tabletop.position.y = 1.25;
            scene.add(tabletop);

            // Create legs for the table
            var legGeometry = new THREE.BoxGeometry(0.5, 2.5, 0.5);
            var legMaterial = new THREE.MeshBasicMaterial({ color: 0x404040 });
            var leg1 = new THREE.Mesh(legGeometry, legMaterial);
            leg1.position.set(-2, -1.25, 1.5);
            var leg2 = leg1.clone();
            leg2.position.set(2, -1.25, 1.5);
            var leg3 = leg1.clone();
            leg3.position.set(-2, -1.25, -1.5);
            var leg4 = leg1.clone();
            leg4.position.set(2, -1.25, -1.5);
            scene.add(leg1, leg2, leg3, leg4);

            // Create a sphere for the ball
            var ballGeometry = new THREE.SphereGeometry(1, 32, 32);
            var ballMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            var ball = new THREE.Mesh(ballGeometry, ballMaterial);
            ball.position.y = 1;
            scene.add(ball);
			

			// Add the AR button to the body of the DOM
			document.body.appendChild(ARButton.createButton(renderer));

			window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('deviceorientation', function(event) {
                ball.position.x = event.gamma / 90;
                ball.position.z = event.beta / 90;  
            
                  // Check if the ball has rolled off the edge of the table
                  if (Math.abs(ball.position.x) >= 4.5 || Math.abs(ball.position.z) >= 4.5) {
                    ball.position.y -= 0.05;
                }

            });
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);
		}

		function animate() {
			renderer.setAnimationLoop(render);
		}

		function render() {  
            requestAnimationFrame(render);    
			renderer.render(scene, camera);
		}
    
	</script>
</body>

</html>
